<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Поле Чудес Онлайн</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw}
#menu{position:fixed;inset:0;background:radial-gradient(circle,#2a1a5c,#0d0521);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px;z-index:100}
#menu h1{color:#ffd700;font-size:2.5rem;text-shadow:3px 3px 6px rgba(0,0,0,0.8);animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 10px #ffd700}to{text-shadow:0 0 30px #ff4500,0 0 40px #ffd700}}
.join-box{display:flex;flex-direction:column;gap:15px;width:100%;max-width:400px}
.join-box input{padding:15px;border-radius:8px;border:2px solid #ffd700;background:rgba(255,255,255,0.1);color:#fff;font-size:1.2rem;text-align:center}
.join-box button{padding:15px;font-size:1.3rem;background:#ffd700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.join-box button:hover{transform:scale(1.05)}
#playerList{color:#aaa;font-size:1.1rem;text-align:center}
#errorMsg{color:#ff4500;font-weight:bold;min-height:20px}
#game{display:none;width:100vw;height:100vh;position:relative;background:linear-gradient(180deg,#1a0a3a 0%,#3a1a6a 50%,#5a2a8a 100%)}
#scene{position:absolute;top:0;left:0;width:100%;height:55%}
#ui{position:absolute;bottom:0;left:0;width:100%;height:45%;background:linear-gradient(180deg,rgba(0,0,0,0.85),rgba(0,0,0,0.97));display:flex;align-items:center;padding:8px 15px;gap:15px}
.wheel-area{display:flex;flex-direction:column;align-items:center;gap:8px}
.wheel-wrap{position:relative;width:170px;height:170px}
#wheel{border:4px solid #ffd700;border-radius:50%}
.arrow{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:22px solid #ff0000;z-index:5}
#spinBtn{padding:8px 20px;font-size:1rem;background:#ffd700;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#spinBtn:disabled{background:#555;color:#999;cursor:not-allowed}
.center-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#currentPlayer{font-size:1.2rem;color:#ffd700;font-weight:bold}
#wordHint{font-size:1rem;color:#ffa500;font-style:italic;background:rgba(255,165,0,0.1);padding:4px 15px;border-radius:8px;border:1px solid #ffa500}
#wordDisplay{font-size:2rem;letter-spacing:8px;font-weight:bold;background:rgba(0,0,0,0.5);padding:8px 25px;border-radius:10px;border:2px solid #ffd700}
#message{font-size:1rem;color:#fff;min-height:20px;text-align:center}
.input-area{display:flex;gap:8px;align-items:center}
#letterInput{padding:8px;font-size:1.2rem;width:60px;text-align:center;text-transform:uppercase;border-radius:5px;border:2px solid #ffd700;background:#222;color:#fff}
#guessBtn,#solveBtn{padding:8px 15px;font-size:0.95rem;background:#32cd32;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
#solveBtn{background:#ff4500}
#guessBtn:disabled,#solveBtn:disabled{background:#555;cursor:not-allowed}
.scoreboard{display:flex;flex-direction:column;gap:4px;min-width:160px;background:rgba(255,255,255,0.05);padding:8px;border-radius:10px}
.score-row{display:flex;justify-content:space-between;padding:4px 8px;border-radius:5px;font-weight:bold;font-size:0.9rem}
.score-row.active{background:rgba(255,215,0,0.3);border:2px solid #ffd700}
#alphabet{position:absolute;top:8px;right:10px;display:flex;flex-wrap:wrap;gap:4px;max-width:340px;justify-content:center;background:rgba(0,0,0,0.6);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,215,0,0.3);z-index:10}
.alpha-letter{width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:bold;border-radius:4px;background:rgba(255,255,255,0.15);color:#ccc;position:relative;transition:all 0.3s}
.alpha-letter.correct{background:rgba(50,205,50,0.4);color:#00ff00;text-shadow:0 0 8px #00ff00;border:1px solid #00ff00}
.alpha-letter.wrong{background:rgba(255,0,0,0.15);color:#ff4444;opacity:0.5}
.alpha-letter.wrong::after{content:'';position:absolute;top:50%;left:2px;right:2px;height:3px;background:#ff0000;transform:rotate(-15deg);border-radius:2px;box-shadow:0 0 6px rgba(255,0,0,0.8)}
</style>
</head>
<body>
<div id="menu">
<h1>🎡 ПОЛЕ ЧУДЕС 🎡</h1>
<div class="join-box">
<input type="text" id="nameInput" placeholder="Ваше имя" maxlength="12">
<input type="password" id="passwordInput" placeholder="Пароль" maxlength="20">
<button id="joinBtn">ПРИСОЕДИНИТЬСЯ</button>
<button id="startBtn" style="display:none;background:#32cd32;color:#fff">НАЧАТЬ ИГРУ</button>
</div>
<div id="playerList">Ожидание игроков...</div>
<div id="errorMsg"></div>
</div>
<div id="game">
<canvas id="scene"></canvas>
<div id="alphabet"></div>
<div id="ui">
<div class="wheel-area">
<div class="wheel-wrap"><div class="arrow"></div><canvas id="wheel" width="170" height="170"></canvas></div>
<button id="spinBtn" disabled>КРУТИТЬ!</button>
</div>
<div class="center-area">
<div id="currentPlayer">Ожидание...</div>
<div id="wordHint">Тема слова</div>
<div id="wordDisplay">_ _ _ _ _</div>
<div id="message">Ждем начала игры</div>
<div class="input-area">
<input type="text" id="letterInput" maxlength="1" placeholder="Б" disabled>
<button id="guessBtn" disabled>БУКВА</button>
<button id="solveBtn" disabled>СЛОВО</button>
</div>
</div>
<div class="scoreboard" id="scoreboard"></div>
</div>
</div>
<script>
const socket = io();
const ALPHA = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split('');
let myId = null, isHost = false, currentRotation = 0, lastState = null;
const sectors = [
  {label:"100",value:100,color:"#ff4500"},{label:"200",value:200,color:"#ffa500"},
  {label:"300",value:300,color:"#ffd700"},{label:"500",value:500,color:"#32cd32"},
  {label:"800",value:800,color:"#1e90ff"},{label:"1000",value:1000,color:"#8a2be2"},
  {label:"БАНКРОТ",value:-1,color:"#000"},{label:"0",value:0,color:"#555"},
  {label:"200",value:200,color:"#ff69b4"},{label:"500",value:500,color:"#00ced1"}
];
const sectorAngle = 360 / sectors.length;

document.getElementById('joinBtn').addEventListener('click', () => {
  socket.emit('join_game', {
    name: document.getElementById('nameInput').value.trim() || 'Игрок',
    password: document.getElementById('passwordInput').value
  });
});
document.getElementById('startBtn').addEventListener('click', () => socket.emit('start_game'));
document.getElementById('spinBtn').addEventListener('click', () => socket.emit('spin_wheel'));
document.getElementById('guessBtn').addEventListener('click', guessLetter);
document.getElementById('letterInput').addEventListener('keypress', e => { if(e.key==='Enter') guessLetter(); });
document.getElementById('solveBtn').addEventListener('click', () => {
  const w = prompt("Введите слово целиком:");
  if(w) socket.emit('guess_word', w);
});

function guessLetter() {
  const l = document.getElementById('letterInput').value.toUpperCase();
  document.getElementById('letterInput').value = '';
  if(l) socket.emit('guess_letter', l);
}

socket.on('connect', () => { myId = socket.id; });
socket.on('error_msg', msg => {
  document.getElementById('errorMsg').textContent = msg;
  setTimeout(() => document.getElementById('errorMsg').textContent = '', 3000);
});

socket.on('game_state', state => {
  lastState = state;
  if(state.gameStarted) {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    updateUI(state);
  } else {
    document.getElementById('menu').style.display = 'flex';
    document.getElementById('game').style.display = 'none';
    let names = state.players.map(p => p.name).join(', ');
    document.getElementById('playerList').textContent = `Игроков: ${state.players.length}/4` + (names ? ` (${names})` : '');
    document.getElementById('startBtn').style.display = (myId === state.hostId && state.players.length >= 2) ? 'block' : 'none';
  }
});

socket.on('speak', text => {
  if(isHost && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = speechSynthesis.getVoices();
    u.voice = v.find(x => x.lang.startsWith('ru')) || v[0];
    u.rate = 0.95; u.lang = 'ru-RU';
    speechSynthesis.speak(u);
  }
});

function updateUI(s) {
  isHost = (myId === s.hostId);
  const me = s.players.find(p => p.id === myId);
  const cur = s.players[s.currentPlayerIndex];
  const myTurn = me && me.id === cur.id;

  document.getElementById('currentPlayer').textContent = `Ход: ${cur.name}`;
  document.getElementById('currentPlayer').style.color = cur.color;
  document.getElementById('wordHint').textContent = '💡 ' + s.currentHint;

  let d = '';
  for(let c of s.currentWord) d += (s.guessedLetters.includes(c) ? c : '_') + ' ';
  document.getElementById('wordDisplay').textContent = d.trim();

  const canAct = myTurn && !s.isSpinning;
  document.getElementById('spinBtn').disabled = !canAct;
  document.getElementById('letterInput').disabled = !canAct;
  document.getElementById('guessBtn').disabled = !canAct;
  document.getElementById('solveBtn').disabled = !canAct;

  if(s.isSpinning) {
    document.getElementById('message').textContent = 'Барабан крутится...';
    animateWheel(s.targetRotation || currentRotation + 1440);
  } else {
    document.getElementById('message').textContent = myTurn ? 'Ваш ход! Крутите или назовите букву.' : `Ходит ${cur.name}`;
  }

  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  s.players.forEach((p,i) => {
    const r = document.createElement('div');
    r.className = 'score-row' + (i === s.currentPlayerIndex ? ' active' : '');
    r.innerHTML = `<span style="color:${p.color}">● ${p.name}</span><span>${p.score}</span>`;
    sb.appendChild(r);
  });

  const ac = document.getElementById('alphabet');
  ac.innerHTML = '';
  ALPHA.forEach(l => {
    const el = document.createElement('div');
    el.className = 'alpha-letter';
    if(s.guessedLetters.includes(l)) el.classList.add('correct');
    else if(s.wrongLetters.includes(l)) el.classList.add('wrong');
    el.textContent = l;
    ac.appendChild(el);
  });

  drawScene(s);
}

function animateWheel(target) {
  const start = currentRotation, t0 = performance.now(), dur = 4000;
  function anim(t) {
    const p = Math.min((t - t0) / dur, 1);
    const ease = 1 - Math.pow(1 - p, 4);
    currentRotation = start + (target - start) * ease;
    drawWheel(currentRotation);
    if(p < 1) requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

const wc = document.getElementById('wheel'), wx = wc.getContext('2d');
function drawWheel(rot) {
  wx.clearRect(0,0,170,170);
  wx.save(); wx.translate(85,85); wx.rotate(rot * Math.PI / 180);
  sectors.forEach((s,i) => {
    const sa = (i*sectorAngle-90)*Math.PI/180, ea = ((i+1)*sectorAngle-90)*Math.PI/180;
    wx.beginPath(); wx.moveTo(0,0); wx.arc(0,0,78,sa,ea); wx.closePath();
    wx.fillStyle = s.color; wx.fill(); wx.strokeStyle = '#fff'; wx.lineWidth = 1.5; wx.stroke();
    wx.save(); wx.rotate((sa+ea)/2); wx.textAlign = 'right';
    wx.fillStyle = s.value===-1?'#fff':'#000'; wx.font = 'bold 11px Arial';
    wx.fillText(s.label, 70, 4); wx.restore();
  });
  wx.restore();
}

const sc = document.getElementById('scene'), sx = sc.getContext('2d');
function drawScene(s) {
  const W = sc.width = sc.offsetWidth, H = sc.height = sc.offsetHeight;
  sx.clearRect(0,0,W,H);
  const bg = sx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2a0a5a'); bg.addColorStop(1,'#5a1a8a');
  sx.fillStyle = bg; sx.fillRect(0,0,W,H);
  sx.fillStyle = '#3a1a1a'; sx.beginPath(); sx.moveTo(0,H*0.7); sx.lineTo(W,H*0.7); sx.lineTo(W,H); sx.lineTo(0,H); sx.closePath(); sx.fill();
  sx.fillStyle = '#8B4513'; sx.beginPath(); sx.ellipse(W/2,H*0.75,W*0.35,40,0,0,Math.PI*2); sx.fill();
  sx.strokeStyle = '#ffd700'; sx.lineWidth = 3; sx.stroke();
  sx.fillStyle = '#1a1a3a'; sx.beginPath(); sx.ellipse(W/2,H*0.45+40,35,50,0,0,Math.PI*2); sx.fill();
  sx.fillStyle = '#f4c2a1'; sx.beginPath(); sx.arc(W/2,H*0.45-20,25,0,Math.PI*2); sx.fill();
  sx.fillStyle = '#888'; sx.beginPath(); sx.arc(W/2,H*0.45-28,25,Math.PI,Math.PI*2); sx.fill();
  sx.strokeStyle = '#666'; sx.lineWidth = 3; sx.beginPath();
  sx.moveTo(W/2-12,H*0.45-12); sx.quadraticCurveTo(W/2-6,H*0.45-8,W/2,H*0.45-12);
  sx.quadraticCurveTo(W/2+6,H*0.45-8,W/2+12,H*0.45-12); sx.stroke();
  sx.fillStyle = '#ffd700'; sx.font = 'bold 22px Arial'; sx.textAlign = 'center';
  sx.fillText('ПОЛЕ ЧУДЕС', W/2, 30);
  const chairs = [{x:W*0.12,y:H*0.68},{x:W*0.36,y:H*0.82},{x:W*0.64,y:H*0.82},{x:W*0.88,y:H*0.68}];
  s.players.forEach((p,i) => {
    const pos = chairs[i]; if(!pos) return;
    const active = s.players[s.currentPlayerIndex].id === p.id;
    if(active){sx.shadowColor=p.color;sx.shadowBlur=25;}
    sx.fillStyle=p.color; sx.fillRect(pos.x-22,pos.y-8,44,55);
    sx.strokeStyle='#ffd700'; sx.lineWidth=2; sx.strokeRect(pos.x-22,pos.y-8,44,55);
    sx.shadowBlur=0;
    sx.fillStyle='#f4c2a1'; sx.beginPath(); sx.arc(pos.x,pos.y-50,16,0,Math.PI*2); sx.fill();
    sx.fillStyle='#fff'; sx.font='bold 13px Arial'; sx.textAlign='center';
    sx.fillText(p.name,pos.x,pos.y+62);
    sx.fillStyle='#ffd700'; sx.fillText(p.score+' оч.',pos.x,pos.y+76);
  });
}
window.addEventListener('resize', () => { if(lastState) drawScene(lastState); });
speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
